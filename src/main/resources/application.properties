spring.application.name=song-player
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/music_streaming}
spring.datasource.username=${DB_USERNAME:music_streaming}
# DB_PASSWORD is required — no insecure default. Set via environment variable or .env file.
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

services:
  postgres:
    image: postgres:17-alpine
    container_name: song-player-postgres
    environment:
      POSTGRES_DB: music_streaming
      POSTGRES_USER: music_streaming
      POSTGRES_PASSWORD: music_streaming
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: song-player-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/music_streaming
      DB_USERNAME: music_streaming
      DB_PASSWORD: music_streaming
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
